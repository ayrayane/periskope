# Adding a GitLab instance is adding an entry here: the chart generates its collector, token and webhook.
instances: []
#  - slug: gl-prod                 # [a-z0-9-], used in queue names, URLs and Secret names
#    name: GitLab production
#    url: https://gitlab.example.com
#    ratePerMin: 600
#    enterprise: true              # false on CE: Ultimate-only checks report unknown
#    spaceDormant: false           # true: idle projects re-analysed weekly (7 days) or monthly (6 months), not nightly
#    sonarUrl: https://sonar.example.com
#    sonarTokenSecret: sonar-token-gl-prod  # key "token": a user token able to browse the projects
#    trackedNamespaces: [platform]
#    excludedNamespaces: [platform/sandbox]
#    # Without Crossplane: existing Secrets holding key "token" (read_api + read_repository, admin-wide read).
#    tokenSecret: gitlab-token-gl-prod
#    webhookSecret: gitlab-webhook-gl-prod
#    # « Corriger dans GitLab »: Maintainers apply a fix with their own GitLab account, on click, after a preview.
#    fixes: false
#    oauthSecret: gitlab-oauth-gl-prod  # client_id / client_secret of a GitLab OAuth application (scope api, redirect https://<host>/api/v1/fixit/<slug>/callback)

image:
  repository: registry.example.com/periskope/periskope
  tag: ""                         # defaults to the chart appVersion
  frontend: registry.example.com/periskope/periskope/frontend
  pullSecret: ""

host: periskope.example.com
# Score-drop alerts: name of a Secret holding the webhook in key `url` (Mattermost incoming webhook or any JSON endpoint). Empty: no alerts.
alerts:
  secret: ""
# Exploitation feeds read each night: they set each CVE's priority. Empty: priority follows GitLab's severity alone.
# With Internet access (direct or through `proxy`), the official files:
#   kevUrl:  https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
#   epssUrl: https://epss.empiricalsecurity.com/epss_scores-current.csv.gz
# Without, a copy of those two files on an internal server. A private CA is trusted through oidc.caConfigMap.
vulnFeeds:
  kevUrl: ""
  epssUrl: ""
  proxy: ""                        # e.g. http://proxy.internal:3128, used for these two files only
  # A URL may hold {date} (YYYY-MM-DD, UTC): the most recent of the last 7 days is read, e.g. a daily archive in Nexus.
# Prometheus Operator resources: a ServiceMonitor (scheduler), a PodMonitor (collectors) and the spec's alert rules.
monitoring:
  enabled: false
  namespace: monitoring            # where Prometheus runs, let through the NetworkPolicy
  labels: {}                       # labels your Prometheus selects monitors and rules by, e.g. release: kube-prometheus-stack
ingress:
  className: ""
  annotations: {}
  tlsSecret: periskope-tls

oidc:
  issuer: https://keycloak.example.com/realms/periskope
  clientId: periskope
  # ConfigMap with a ca.crt when Keycloak or GitLab use a private CA.
  caConfigMap: ""
  # Keycloak role (realm or client) -> Periskope right: viewer (GitLab membership), auditor (reads every project, administers
  # nothing), admin. Unmapped roles named viewer/auditor/admin or periskope-<right> are taken as is.
  # Example for an LDAP-backed workspace: { manager: auditor, user: viewer }
  roleMap: {}

# Periskope admins by Keycloak login, whatever their Keycloak roles; usually kept in the deployment repository (admins.yaml).
# Logins must be unique and fixed (directory accounts, no self-registration): a login listed here is trusted as is.
admins: []

# How a Keycloak user is tied to their GitLab account on each instance.
identity:
  # verified_email: the e-mail, when Keycloak marks it verified and GitLab has the same one.
  # username: the login, for a realm whose accounts all come from a trusted directory (LDAP), with no local accounts.
  match: verified_email
  # With match=username, accept only GitLab accounts linked to the LDAP (never a local GitLab account of the same name).
  gitlabLdapOnly: false

# OIDC client declared through the Keycloak operator (26.8+ KeycloakOIDCClient).
keycloakClient:
  enabled: false
  keycloak: keycloak              # name of the Keycloak CR
  namespace: keycloak
  realm: periskope

crossplane:
  # When enabled, a claim per instance creates the read token and the system hook; tokenSecret/webhookSecret are ignored.
  # The kinds come from the platform's own XRDs and Compositions (outside this chart): set them to match.
  enabled: false
  providerConfigPrefix: gitlab-
  apiVersion: platform.example.com/v1alpha1
  tokenKind: GitLabReadToken
  hookKind: GitLabSystemHook

keda:
  # When enabled, each collector scales 0-2 on its queue depth; otherwise one replica per instance.
  enabled: false
  minReplicas: 1
  threshold: 200
  # Where KEDA runs: its metrics-api scaler reads the queue depth from the scheduler.
  namespace: keda

postgres:
  instances: 2
  storage: 20Gi
  backup:
    enabled: false
    destinationPath: ""           # s3://bucket/periskope
    endpointURL: ""               # S3 endpoint other than AWS, e.g. http://garage.garage.svc:3900
    secret: ""                    # Secret with ACCESS_KEY_ID / ACCESS_SECRET_KEY

api:
  replicas: 2
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 512Mi } }
collector:
  concurrency: 20
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 1Gi } }
scheduler:
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
timezone: Europe/Paris

networkPolicy:
  enabled: true
  # Pods allowed to reach the API, frontend and webhook receiver: the ingress controller.
  ingressFrom:
    namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
  # Extra peers allowed to post webhooks straight to the scheduler service, e.g. a GitLab running in the same cluster.
  hooksFrom: []
