{{- if .Values.keycloakClient.enabled }}
# Browser client (authorization code + PKCE). Its roles are viewer, maintainer and admin; the API accepts the tokens
# issued to this client (azp), whatever their aud.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakOIDCClient
metadata: { name: {{ .Values.oidc.clientId }}, namespace: {{ .Values.keycloakClient.namespace }} }
spec:
  keycloakCRName: {{ .Values.keycloakClient.keycloak }}
  realm: {{ .Values.keycloakClient.realm }}
  client:
    displayName: Periskope
    enabled: true
    appUrl: https://{{ .Values.host }}
    loginFlows: [STANDARD]
    redirectUris: ["https://{{ .Values.host }}/*"]
    webOrigins: ["https://{{ .Values.host }}"]
    roles: [viewer, maintainer, admin]
{{- end }}
