# Monorepo CI: tests and boundaries on every MR, images and chart on tags (same version for all three).
stages: [test, build, publish]

variables:
  UV_CACHE_DIR: .uv-cache
  TRIVY_IMAGE: aquasec/trivy:0.58.1

# Periskope checks these on every project it scores, so its own CI carries them too.
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

# The lab node is short on I/O: a pod that fails to start or a dropped kubelet connection is retried, a failing test is not.
default:
  retry: { max: 2, when: [runner_system_failure, stuck_or_timeout_failure] }

.changes-python: &python [packages/**/*, services/**/*, tests/**/*, pyproject.toml, uv.lock]

python:
  stage: test
  image: ghcr.io/astral-sh/uv:0.5.11-python3.12-bookworm-slim
  services:
    - { name: docker.io/library/postgres:16-alpine, alias: postgres }
    - { name: docker.io/valkey/valkey:8-alpine, alias: valkey }
  variables:
    POSTGRES_USER: periskope
    POSTGRES_PASSWORD: ci
    PERISKOPE_TEST_DATABASE_URL: postgresql://periskope:ci@postgres:5432/periskope
    PERISKOPE_TEST_VALKEY_URL: redis://valkey:6379
  rules: [{ changes: *python }, { if: $CI_COMMIT_TAG }]
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run lint-imports
    # The spec's quality bar: at least 70 % of the check engine covered by tests.
    - uv run pytest -q --junitxml=report.xml --cov=periskope_checks --cov-report=term --cov-report=xml:coverage.xml --cov-fail-under=70
  coverage: '/^TOTAL.*\s(\d+)%$/'
  cache: { key: uv, paths: [.uv-cache] }
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report: { coverage_format: cobertura, path: coverage.xml }

frontend:
  stage: test
  image: node:22-alpine
  rules: [{ changes: [frontend/**/*] }, { if: $CI_COMMIT_TAG }]
  script:
    - cd frontend && npm ci && npm run typecheck && npm test && npm run build
    - npm audit --omit=dev --audit-level=high

sbom:
  stage: test
  image: { name: $TRIVY_IMAGE, entrypoint: [""] }
  rules: [{ if: $CI_COMMIT_TAG }, { if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH }, { if: $CI_PIPELINE_SOURCE == "merge_request_event" }]
  script:
    - trivy fs --format cyclonedx --output gl-sbom-periskope.cdx.json .
    # Shipped dependencies only (dev tooling never reaches the images); fixable criticals and highs block.
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
  artifacts: { reports: { cyclonedx: gl-sbom-periskope.cdx.json } }

chart:lint:
  stage: test
  image: alpine/helm:3.16.3
  rules: [{ changes: [chart/**/*] }, { if: $CI_COMMIT_TAG }]
  script:
    - helm lint chart/periskope -f chart/periskope/ci-values.yaml

chart:render:
  stage: test
  image: alpine/helm:3.16.3
  rules: [{ changes: [chart/**/*] }]
  script:
    - wget -qO- https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin
    - helm template periskope chart/periskope -f chart/periskope/ci-values.yaml
      | kubeconform -strict -summary -ignore-missing-schemas
        -schema-location default
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

chart:unittest:
  stage: test
  image: alpine/helm:3.16.3
  rules: [{ changes: [chart/**/*] }]
  script:
    - helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.6.3
    - helm unittest chart/periskope

.kaniko:
  image: { name: gcr.io/kaniko-project/executor:v1.23.2-debug, entrypoint: [""] }
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - CERT=""; if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then CERT="--registry-certificate $CI_REGISTRY=$CI_SERVER_TLS_CA_FILE"; fi
    - TAG="${CI_COMMIT_TAG#v}"; TAG="${TAG:-$CI_COMMIT_SHORT_SHA}"

image:python:
  stage: build
  extends: .kaniko
  rules: [{ if: $CI_COMMIT_TAG }, { if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH, changes: *python }]
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile Dockerfile $CERT --destination "$CI_REGISTRY_IMAGE:$TAG"

image:frontend:
  stage: build
  extends: .kaniko
  rules: [{ if: $CI_COMMIT_TAG }, { if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH, changes: [frontend/**/*] }]
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR/frontend" --dockerfile "$CI_PROJECT_DIR/frontend/Dockerfile" $CERT --destination "$CI_REGISTRY_IMAGE/frontend:$TAG"

image:scan:
  stage: publish
  image: { name: $TRIVY_IMAGE, entrypoint: [""] }
  rules: [{ if: $CI_COMMIT_TAG }]
  variables: { TRIVY_USERNAME: $CI_REGISTRY_USER, TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD }
  script:
    - TAG="${CI_COMMIT_TAG#v}"
    - if [ -n "$CI_SERVER_TLS_CA_FILE" ]; then export SSL_CERT_FILE="$CI_SERVER_TLS_CA_FILE"; fi
    - for img in "$CI_REGISTRY_IMAGE:$TAG" "$CI_REGISTRY_IMAGE/frontend:$TAG"; do
        trivy image --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1 "$img" || exit 1;
      done

chart:publish:
  stage: publish
  image: alpine/helm:3.16.3
  rules: [{ if: $CI_COMMIT_TAG }]
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - helm package chart/periskope --version "$VERSION" --app-version "$VERSION"
    - echo "$CI_REGISTRY_PASSWORD" | helm registry login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin ${CI_SERVER_TLS_CA_FILE:+--ca-file $CI_SERVER_TLS_CA_FILE}
    - helm push "periskope-$VERSION.tgz" "oci://$CI_REGISTRY_IMAGE/charts" ${CI_SERVER_TLS_CA_FILE:+--ca-file $CI_SERVER_TLS_CA_FILE}
