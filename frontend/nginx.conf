server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml;
  gzip_min_length 1024;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https:; img-src 'self' data:; style-src 'self'; frame-ancestors 'none'" always;
  # expires, not add_header: an add_header in a location would drop the security headers above.
  location /assets/ { expires 1y; }
  location = /config.json { expires -1; }
  # A stale index.html would point at bundles a new release removed.
  location = /index.html { expires -1; }
  location / { try_files $uri /index.html; }
}
